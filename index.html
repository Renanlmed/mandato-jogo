<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>MANDATO — Simulador de Geopolítica</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
/* ==========================================================================
   ORDEM MUNDIAL — Folha de estilos (pixel art / sala de comando)
   ========================================================================== */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  --bg-deep: #0a0e1a;
  --bg-main: #0f1830;
  --bg-panel: #16213f;
  --bg-panel-alt: #1c2a4d;
  --bg-card: #1a2544;
  --border-dark: #060a14;
  --text-main: #eef2ff;
  --text-dim: #9fb0d0;
  --text-faint: #6b7aa1;

  --c-green: #3FAE58;
  --c-green-light: #6EE7B7;
  --c-red: #C0392B;
  --c-red-dark: #8B1E2C;
  --c-yellow: #E0B400;
  --c-blue: #4EA8FF;
  --c-purple: #9B5DE5;
  --c-pink: #F15BB5;
  --c-orange: #F5A623;

  --font-display: "Press Start 2P", "Courier New", monospace;
  --font-body: "VT323", "Courier New", monospace;

  --shadow-hard: 4px 4px 0 rgba(0,0,0,0.55);
  --shadow-hard-sm: 2px 2px 0 rgba(0,0,0,0.55);
  --shadow-hard-lg: 7px 7px 0 rgba(0,0,0,0.55);
}

body {
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 19px;
  line-height: 1.35;
  -webkit-font-smoothing: none;
}

#root { min-height: 100vh; }

/* Temas nacionais: cada país muda a atmosfera, a iluminação e as cores da sala de comando. */
.app-root.theme-aurora {
  --theme-backdrop: radial-gradient(circle at 50% 0%, rgba(64, 128, 255, 0.28), transparent 42%), linear-gradient(135deg, #08152f 0%, #101d3c 55%, #1c2d57 100%);
  --theme-glow: #4ea8ff;
  --theme-secondary: #f5c542;
}
.app-root.theme-karibu {
  --theme-backdrop: radial-gradient(circle at 80% 10%, rgba(245, 166, 35, 0.24), transparent 34%), linear-gradient(135deg, #102718 0%, #183b2a 52%, #3c4a24 100%);
  --theme-glow: #4caf50;
  --theme-secondary: #f5a623;
}
.app-root.theme-nordland {
  --theme-backdrop: radial-gradient(circle at 20% 0%, rgba(79, 199, 199, 0.24), transparent 38%), linear-gradient(135deg, #071d2c 0%, #103848 55%, #244d5b 100%);
  --theme-glow: #2fb6c2;
  --theme-secondary: #f5c542;
}
.app-root.theme-soleria {
  --theme-backdrop: radial-gradient(circle at 75% 0%, rgba(245, 166, 35, 0.24), transparent 36%), linear-gradient(135deg, #2a0d16 0%, #4c1824 54%, #261721 100%);
  --theme-glow: #b84a56;
  --theme-secondary: #f5c542;
}
.app-root.theme-pacifica {
  --theme-backdrop: radial-gradient(circle at 50% 0%, rgba(79, 199, 199, 0.3), transparent 40%), linear-gradient(135deg, #06252e 0%, #0b4c59 56%, #176c72 100%);
  --theme-glow: #4fc7c7;
  --theme-secondary: #ff7f50;
}
.app-root.theme-ferrovia {
  --theme-backdrop: radial-gradient(circle at 85% 0%, rgba(192, 57, 43, 0.24), transparent 34%), linear-gradient(135deg, #13171b 0%, #2d3338 56%, #4a3233 100%);
  --theme-glow: #83898f;
  --theme-secondary: #c0392b;
}
.app-root[class*="theme-"] { background: var(--theme-backdrop, radial-gradient(circle at 50% 0%, #1a2544 0%, var(--bg-deep) 70%)); }
.app-root[class*="theme-"] .game-screen { background: var(--theme-backdrop); }

button, input { font-family: inherit; }

.app-root {
  position: relative;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 0%, #1a2544 0%, var(--bg-deep) 70%);
}

img, .pixel-grid, .pixel-flag-frame, .pixel-avatar-frame {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

h1, h2, h3 { font-family: var(--font-display); margin: 0; }

.screen {
  position: relative;
  min-height: 100vh;
  width: 100%;
  overflow-x: hidden;
}

/* Scanline / command-room texture overlay */
.screen::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.018) 0px,
    rgba(255,255,255,0.018) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index: 200;
  mix-blend-mode: overlay;
}

/* ==========================================================================
   COMPONENTES COMPARTILHADOS: painéis, botões, tooltips
   ========================================================================== */

.pixel-panel {
  background: var(--bg-panel);
  border: 3px solid var(--border-dark);
  box-shadow: var(--shadow-hard);
  border-radius: 0;
  padding: 14px 16px;
  margin: 0 0 14px 0;
}
.pixel-panel-title {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--accent, var(--c-blue));
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 2px dashed rgba(255,255,255,0.12);
  padding-bottom: 8px;
}
.pixel-panel-icon { font-size: 15px; }
.pixel-panel-body { font-size: 19px; color: var(--text-dim); }

.pixel-btn {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.5px;
  padding: 12px 16px;
  border: 3px solid var(--border-dark);
  border-radius: 0;
  cursor: pointer;
  box-shadow: var(--shadow-hard-sm);
  background: var(--bg-panel-alt);
  color: var(--text-main);
  transition: transform 0.05s ease;
  text-transform: uppercase;
}
.pixel-btn:hover:not(:disabled) { filter: brightness(1.15); }
.pixel-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 rgba(0,0,0,0.5); }
.pixel-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.pixel-btn-primary { background: linear-gradient(180deg, #2f6fd6, #1f4fa3); border-color: #0d1f45; }
.pixel-btn-success { background: linear-gradient(180deg, #4bc46a, #2c8f45); border-color: #123c1c; }
.pixel-btn-danger { background: linear-gradient(180deg, #d1493a, #a3291c); border-color: #4a0f09; }
.pixel-btn-ghost { background: transparent; border-color: rgba(255,255,255,0.35); }
.pixel-btn-default { background: var(--bg-panel-alt); }

.pixel-btn-sm { font-size: 9px; padding: 8px 10px; }
.pixel-btn-lg { font-size: 13px; padding: 16px 22px; }
.pixel-btn-full { width: 100%; }

.info-dot-wrap { position: relative; display: inline-block; margin-left: 4px; }
.info-dot {
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(255,255,255,0.15); color: var(--text-main);
  border: 1px solid rgba(255,255,255,0.3);
  font-family: var(--font-display); font-size: 10px;
  cursor: pointer; line-height: 1;
}
.info-tooltip {
  position: absolute; z-index: 50; top: 24px; left: 0;
  width: 220px; background: #05070d; color: var(--text-main);
  border: 2px solid var(--c-blue); padding: 10px; font-size: 16px;
  box-shadow: var(--shadow-hard-sm);
}

.modal-overlay {
  position: fixed; inset: 0; background: rgba(3,5,12,0.82);
  display: flex; align-items: center; justify-content: center;
  z-index: 300; padding: 16px; overflow-y: auto;
}
.modal-box {
  background: var(--bg-panel);
  border: 4px solid var(--border-dark);
  box-shadow: var(--shadow-hard-lg);
  padding: 20px; max-width: 480px; width: 100%;
  max-height: 90vh; overflow-y: auto;
}
.modal-box-wide { max-width: 720px; }

.legend-chip {
  display: inline-block; padding: 4px 8px; margin: 3px; font-size: 15px;
  color: #0a0f1c; border: 2px solid var(--border-dark);
}

/* ==========================================================================
   PIXEL GRID (bandeiras e avatares)
   ========================================================================== */

.pixel-grid { display: grid; gap: 0; }
.pixel-flag-frame {
  display: inline-block; border: 2px solid var(--border-dark);
  box-shadow: var(--shadow-hard-sm); background: #000;
  flex-shrink: 0;
}
.pixel-avatar-frame {
  display: inline-block; border: 3px solid var(--advisor-color, var(--c-blue));
  box-shadow: var(--shadow-hard-sm); background: #0a0f1c;
  flex-shrink: 0;
}

/* ==========================================================================
   TELA INICIAL
   ========================================================================== */

.world-map-bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
.world-map-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(78,168,255,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(78,168,255,0.07) 1px, transparent 1px);
  background-size: 34px 34px;
}
.map-block {
  position: absolute; background: rgba(63,174,88,0.16);
  border: 1px solid rgba(110,231,183,0.18);
}

.start-topbar { position: relative; z-index: 2; display: flex; justify-content: flex-end; padding: 16px 20px; }
.sound-toggle {
  font-family: var(--font-body); font-size: 18px; color: var(--text-main);
  background: rgba(10,14,26,0.7); border: 2px solid rgba(255,255,255,0.25);
  padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.sound-toggle-label { font-size: 14px; color: var(--text-dim); }

.start-content {
  position: relative; z-index: 2;
  max-width: 760px; margin: 0 auto; padding: 20px 24px 60px;
  text-align: center; display: flex; flex-direction: column; align-items: center;
}
.start-advisors-row { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
.game-title {
  font-size: clamp(28px, 7vw, 48px); color: #fff; letter-spacing: 2px;
  text-shadow: 4px 4px 0 var(--c-blue), 8px 8px 0 rgba(0,0,0,0.4);
  margin-bottom: 8px;
}
.game-credit {
  font-family: var(--font-display);
  font-size: clamp(10px, 2.5vw, 13px);
  color: var(--c-green-light);
  letter-spacing: 0.8px;
  margin: 0 0 16px;
  text-transform: lowercase;
}
.game-subtitle { font-family: var(--font-display); font-size: clamp(12px, 3vw, 16px); color: var(--c-orange); margin-bottom: 20px; }
.game-intro-text { font-size: 21px; color: var(--text-dim); max-width: 560px; margin-bottom: 18px; }
.game-message-box {
  font-style: italic; font-size: 19px; color: var(--text-main);
  background: rgba(10,14,26,0.6); border-left: 4px solid var(--c-blue);
  padding: 14px 18px; margin-bottom: 30px; max-width: 560px;
}
.start-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.start-promise {
  max-width: 610px; margin: -6px 0 18px; color: var(--text-main); font-size: 20px;
  letter-spacing: 0.2px;
}
.start-features {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  width: 100%; max-width: 650px; margin: 0 0 26px;
}
.start-feature {
  min-height: 58px; padding: 10px 8px; background: rgba(10,14,26,0.58);
  border: 2px solid rgba(110,231,183,0.35); color: var(--text-main);
  font-size: 17px; display: flex; align-items: center; justify-content: center;
  text-align: center; line-height: 1.1;
}
.start-feature strong { display: block; color: var(--c-green-light); font-family: var(--font-display); font-size: 9px; margin-bottom: 5px; }
.sound-toggle:focus-visible, .pixel-btn:focus-visible { outline: 3px solid var(--c-yellow); outline-offset: 3px; }
@media (max-width: 520px) {
  .start-features { grid-template-columns: 1fr; max-width: 320px; }
  .start-feature { min-height: 44px; }
  .start-promise { font-size: 19px; }
}

/* ==========================================================================
   TELA "COMO JOGAR"
   ========================================================================== */

.howto-content { position: relative; z-index: 2; max-width: 720px; margin: 0 auto; padding: 40px 20px; }
.howto-panel { --accent: var(--c-orange); }
.howto-list { padding-left: 24px; font-size: 20px; color: var(--text-main); }
.howto-list li { margin-bottom: 10px; }
.howto-legend { margin-top: 16px; border-top: 2px dashed rgba(255,255,255,0.12); padding-top: 12px; }
.howto-legend-title { font-size: 16px; color: var(--text-dim); margin-bottom: 8px; }
.howto-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }

/* ==========================================================================
   SELEÇÃO DE PAÍSES
   ========================================================================== */

.select-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; position: sticky; top: 0; z-index: 10;
  background: rgba(10,14,26,0.92); border-bottom: 3px solid var(--border-dark);
}
.select-title { font-size: clamp(14px, 4vw, 20px); color: #fff; letter-spacing: 1px; }

.country-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px; padding: 20px; max-width: 1200px; margin: 0 auto 90px;
}

.country-card {
  background: var(--bg-card); border: 3px solid var(--border-dark);
  box-shadow: var(--shadow-hard); padding: 14px; text-align: left; cursor: pointer;
  color: var(--text-main); font-family: var(--font-body); font-size: 17px;
  border-top: 6px solid var(--country-color);
  transition: transform 0.08s ease;
}
.country-card:hover { transform: translateY(-2px); }
.country-card.selected { outline: 3px solid var(--country-color); box-shadow: 0 0 0 3px rgba(255,255,255,0.15), var(--shadow-hard); }

.country-card-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.country-name { font-family: var(--font-display); font-size: 13px; color: #fff; margin-bottom: 4px; line-height: 1.4; }
.country-motto { font-size: 15px; color: var(--country-color); font-style: italic; }
.country-desc { color: var(--text-dim); font-size: 17px; margin: 8px 0; }
.country-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.country-tag { background: rgba(255,255,255,0.08); padding: 3px 8px; font-size: 14px; color: var(--text-dim); }
.country-pros-cons { font-size: 15px; margin-bottom: 10px; }
.country-pro { color: var(--c-green-light); margin-bottom: 3px; }
.country-con { color: var(--c-yellow); }
.country-preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 8px; }
.country-preview-item { display: flex; flex-direction: column; align-items: center; font-size: 15px; color: var(--text-dim); }

.select-footer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: rgba(10,14,26,0.96); border-top: 3px solid var(--border-dark);
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; transform: translateY(100%); transition: transform 0.15s ease; flex-wrap: wrap;
}
.select-footer.visible { transform: translateY(0); }
.select-footer-info { font-size: 18px; color: var(--text-dim); }

/* ==========================================================================
   CABEÇALHO DO JOGO
   ========================================================================== */

.game-header {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: 10px; background: #0a0f1c; border-bottom: 3px solid var(--border-dark);
  padding: 8px 16px;
}
.game-header-left { display: flex; align-items: center; gap: 10px; }
.game-header-country-name { font-family: var(--font-display); font-size: 12px; color: #fff; }
.game-header-year { font-size: 15px; color: var(--text-dim); }
.game-header-mid { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header-stat { display: flex; align-items: center; gap: 5px; font-size: 20px; color: var(--text-main); }
.critical-text { color: var(--c-red); font-weight: bold; }
.game-header-right { display: flex; align-items: center; gap: 8px; }
.game-screen { min-height: 100vh; background: var(--theme-backdrop, linear-gradient(135deg, var(--bg-deep), var(--bg-main))); }
.country-scenery {
  position: relative; overflow: hidden; max-width: 1200px; margin: 0 auto;
  min-height: 92px; padding: 16px 20px; border-bottom: 3px solid var(--border-dark);
  background: linear-gradient(90deg, rgba(5, 8, 18, 0.88), rgba(5, 8, 18, 0.35)), var(--scene-gradient);
  box-shadow: inset 0 -18px 30px rgba(0,0,0,0.22);
}
.country-scenery::before {
  content: ""; position: absolute; inset: 0; opacity: 0.18; pointer-events: none;
  background-image: linear-gradient(135deg, transparent 48%, var(--scene-accent) 49%, transparent 51%), linear-gradient(45deg, transparent 48%, var(--scene-accent) 49%, transparent 51%);
  background-size: 34px 34px; transform: translateX(12%);
}
.country-scenery::after {
  content: ""; position: absolute; right: 28px; bottom: -22px; width: 180px; height: 90px; opacity: 0.32;
  background: radial-gradient(ellipse, var(--scene-accent), transparent 68%); filter: blur(4px);
}
.country-scenery-content { position: relative; z-index: 1; display: flex; align-items: center; gap: 13px; }
.country-scenery-icon { font-size: 34px; filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.45)); }
.country-scenery-kicker { font-family: var(--font-display); font-size: 10px; color: var(--scene-accent); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
.country-scenery-title { font-family: var(--font-display); font-size: 14px; color: #fff; margin-bottom: 4px; }
.country-scenery-copy { color: var(--text-dim); font-size: 18px; }
.country-scenery-aurora { --scene-gradient: linear-gradient(115deg, #1a3c76, #2d508b 45%, #182748); --scene-accent: #f5c542; }
.country-scenery-karibu { --scene-gradient: linear-gradient(115deg, #193d25, #4c542b 45%, #172b1f); --scene-accent: #f5a623; }
.country-scenery-nordland { --scene-gradient: linear-gradient(115deg, #174b5b, #418391 45%, #102b3a); --scene-accent: #f5c542; }
.country-scenery-soleria { --scene-gradient: linear-gradient(115deg, #5a1a24, #9a402b 45%, #28141b); --scene-accent: #f5c542; }
.country-scenery-pacifica { --scene-gradient: linear-gradient(115deg, #0c6571, #29a0a0 45%, #092f42); --scene-accent: #ff7f50; }
.country-scenery-ferrovia { --scene-gradient: linear-gradient(115deg, #242c31, #5b6267 45%, #341d20); --scene-accent: #c0392b; }
.header-icon-btn {
  background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
  color: var(--text-main); font-size: 16px; padding: 6px 9px; cursor: pointer;
}
.action-pips { display: inline-flex; gap: 4px; }
.pip { width: 12px; height: 12px; border: 2px solid var(--text-dim); display: inline-block; }
.pip-filled { background: var(--c-green-light); border-color: var(--c-green-light); }

/* ==========================================================================
   PAINEL DE INDICADORES
   ========================================================================== */

.indicators-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px; padding: 10px 16px;
}
.indicator-card {
  background: var(--bg-card); border: 2px solid var(--border-dark);
  box-shadow: var(--shadow-hard-sm); padding: 8px 10px;
  position: relative; transition: box-shadow 0.2s ease;
}
.indicator-card.status-warn { border-color: var(--c-yellow); }
.indicator-card.status-critical { border-color: var(--c-red); animation: pulse-critical 1.4s infinite; }
.indicator-head { display: flex; align-items: center; gap: 5px; font-size: 15px; color: var(--text-dim); margin-bottom: 3px; }
.indicator-icon { font-size: 15px; }
.indicator-label { flex: 1; }
.indicator-value { font-family: var(--font-display); font-size: 17px; color: #fff; margin-bottom: 6px; }
.indicator-bar-track { height: 8px; background: #060a14; border: 1px solid var(--border-dark); overflow: hidden; }
.indicator-bar-fill { height: 100%; transition: width 0.5s ease; }
.indicator-alert { font-size: 13px; color: var(--c-yellow); margin-top: 4px; }
.indicator-alert.critical { color: var(--c-red); }

.flash-up { animation: flash-good 0.9s ease; }
.flash-down { animation: flash-bad 0.9s ease; }

@keyframes flash-good { 0% { box-shadow: 0 0 0 3px rgba(63,174,88,0.9); } 100% { box-shadow: var(--shadow-hard-sm); } }
@keyframes flash-bad { 0% { box-shadow: 0 0 0 3px rgba(192,57,43,0.9); } 100% { box-shadow: var(--shadow-hard-sm); } }
@keyframes pulse-critical { 0%, 100% { box-shadow: var(--shadow-hard-sm); } 50% { box-shadow: 0 0 0 3px rgba(192,57,43,0.6); } }

/* ==========================================================================
   ABAS
   ========================================================================== */

.tab-nav {
  display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto;
  border-bottom: 2px solid var(--border-dark);
}
.tab-btn {
  font-family: var(--font-display); font-size: 10px; color: var(--text-dim);
  background: var(--bg-panel-alt); border: 2px solid var(--border-dark);
  padding: 10px 12px; cursor: pointer; white-space: nowrap; display: flex; gap: 6px; align-items: center;
}
.tab-btn.active { color: #fff; background: #274a8b; border-color: var(--c-blue); }
.tab-content { padding: 16px; padding-bottom: 110px; max-width: 1200px; margin: 0 auto; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

.action-card {
  background: var(--bg-card); border: 2px solid var(--border-dark);
  border-left: 6px solid var(--cat-color, var(--c-blue));

function applyForeignRelationAction(state, targetId, action) {
    const current = state.relations[targetId] || { score: 48, alliance: false, sanctioned: false, tradePact: false, aidSent: false };
    const nextScore = clamp(current.score + action.relationDelta, 0, 100);
    const nextRelation = {
        ...current,
        score: nextScore,
        alliance: action.id === "alliance" ? true : action.id === "sanctions" ? false : current.alliance,
        sanctioned: action.id === "sanctions" ? true : action.id === "alliance" ? false : current.sanctioned,
        tradePact: action.id === "trade" ? true : current.tradePact,
        aidSent: action.id === "aid" ? true : current.aidSent,
    };
    nextRelation.status = relationStatus(nextScore, nextRelation);
    const target = getCountry(targetId);
    const historyEntry = {
        year: state.year,
        targetId,
        targetName: target.name,
        actionId: action.id,
        actionTitle: action.title,
        relationBefore: current.score,
        relationAfter: nextScore,
        relationDelta: action.relationDelta,
        status: nextRelation.status,
    };
    return {
        ...state,
        relations: { ...state.relations, [targetId]: nextRelation },
        diplomaticActionsThisYear: new Set([...Array.from(state.diplomaticActionsThisYear || []), `${targetId}:${action.id}`]),
        diplomaticHistory: [...(state.diplomaticHistory || []), historyEntry],
    };
}

        sound.startMusic();

        setRestartToken(0);
        setScreen("game");
